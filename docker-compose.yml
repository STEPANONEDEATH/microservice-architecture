services:
  redis:
    image: redis:7
    ports:
      - "6379:6379"

  rabbitmq:
    image: rabbitmq:3-management
    hostname: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"
      - "15672:15672"

  booking-service:
    build:
      context: ./BookingService
      dockerfile: Dockerfile
    ports:
      - "5001:80"
    depends_on:
      - rabbitmq
      - redis

  profiles-service:
    build:
      context: ./ProfilesService
      dockerfile: Dockerfile
    ports:
      - "5002:80"
    depends_on:
      - rabbitmq
      - redis
